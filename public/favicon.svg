<!--
  Favicon — bản Primary của nhận diện Financial.
  Nguồn gốc hình nằm ở src/components/BrandMark.tsx; sửa một bên thì sửa cả hai.
  File này phải đứng độc lập (trình duyệt nạp trực tiếp, không qua React) nên
  không dùng biến CSS, và id gradient được đặt tiền tố `fv-` để không đụng với
  các <defs> khác nếu ai đó nhúng thẳng SVG này vào trang.

  Chữ S dựng hình: đối xứng quay 180° quanh (48,48), hai bầu là cung phần tư
  ellipse rx17/ry14.5, giữa hai bầu là một đoạn thẳng nghiêng xuống 12° — cả
  mark xoay ngược 14° nên đoạn đó thành đi lên 2°. Chú thích đầy đủ ở BrandMark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2A6E"/>
      <stop offset=".55" stop-color="#1B54D6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="fv-sheen" cx=".22" cy=".06" r=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fv-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="fv-mark" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#fv-bg)"/>
  <rect width="96" height="96" rx="22" fill="url(#fv-sheen)"/>

  <g transform="rotate(-14 48 48)">
    <path d="M59.37 24.72 C56.25 22.32 52.2 21 48 21
             C38.61 21 31 27.49 31 35.5
             C31 42.1 32.75 44.76 39.2 46.13
             L56.8 49.87
             C63.25 51.24 65 53.9 65 60.5
             C65 68.51 57.39 75 48 75
             C43.8 75 39.75 73.68 36.63 71.28"
          fill="none" stroke="url(#fv-mark)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x=".75" y=".75" width="94.5" height="94.5" rx="21.4" fill="none"
        stroke="url(#fv-edge)" stroke-width="1.25"/>
</svg>
