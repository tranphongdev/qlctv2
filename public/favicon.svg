<!--
  Favicon — bản Primary của nhận diện Financial.
  Nguồn gốc hình nằm ở src/components/BrandMark.tsx; sửa một bên thì sửa cả hai.
  File này phải đứng độc lập (trình duyệt nạp trực tiếp, không qua React) nên
  không dùng biến CSS, và id gradient được đặt tiền tố `fv-` để không đụng với
  các <defs> khác nếu ai đó nhúng thẳng SVG này vào trang.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="fv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".42" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="fv-glow" cx=".16" cy=".9" r=".78">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fv-sheen" cx=".26" cy=".04" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Dải sáng chéo đi lên: tín hiệu tăng trưởng, đọc thành phản chiếu chứ
         không thành nét gạch ngang chữ S. -->
    <linearGradient id="fv-band" x1="0" y1="1" x2="1" y2="0">
      <stop offset=".24" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fv-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="fv-mark" x1=".1" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#DCE7FF"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#fv-bg)"/>
  <rect width="96" height="96" rx="22" fill="url(#fv-glow)"/>
  <rect width="96" height="96" rx="22" fill="url(#fv-band)"/>
  <rect width="96" height="96" rx="22" fill="url(#fv-sheen)"/>

  <g transform="rotate(-14 48 48)">
    <path d="M62 34.5 C62 27.5 54.5 24 46 24 C37 24 31.5 28.5 31.5 35
             C31.5 41.5 38 44.5 48 48 C58 51.5 64.5 54.5 64.5 61
             C64.5 67.5 58 72 49 72 C40.5 72 33.5 68.5 31.5 62.5"
          fill="none" stroke="url(#fv-mark)" stroke-width="13.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x=".75" y=".75" width="94.5" height="94.5" rx="21.4" fill="none"
        stroke="url(#fv-edge)" stroke-width="1.5"/>
</svg>
